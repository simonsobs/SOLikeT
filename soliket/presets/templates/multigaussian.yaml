# Cobaya info template for the `multigaussian` preset (MFLike + lensing combined).
# Params are supplied separately by the loader from the Fiducial map.
likelihood:
  soliket.gaussian.MultiGaussianLikelihood:
    components:
      - mflike.TTTEEE
      - soliket.LensingLikelihood
    options:
      - input_file: LAT_simu_sacc_00044.fits
        cov_Bbl_file: data_sacc_w_covar_and_Bbl.fits
      - theory_lmax: 5000
        stop_at_error: true
    stop_at_error: true
theory:
  camb:
    extra_args:
      lens_potential_accuracy: 1
    stop_at_error: false
  mflike.BandpowerForeground:
    stop_at_error: true
sampler:
  evaluate:
