# camb setup shared by every run: camb's normal hierarchy for the sum `mnu` of
# cosmo.yaml (a single massive neutrino below mnu ~ 0.060 eV, as at the fiducial).
# Precision settings of each probe are in probes/<probe>/camb.yaml.
theory:
  camb:
    extra_args:
      neutrino_hierarchy: normal
      num_massive_neutrinos: 3
