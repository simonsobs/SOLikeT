# Galaxy x CMB lensing; data file from paths.yaml. use_spectra keeps only the
# galaxy x kappa cross-spectrum; its tracer names must match the data file.
likelihood:
  soliket.GalaxyKappaLikelihood:
    datapath: '{galaxy_kappa_data}'
    use_spectra: [[gc_unwise, ck_so]]
    ncovsims: null
    stop_at_error: true
